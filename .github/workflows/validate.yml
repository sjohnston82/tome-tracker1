name: Validate Tome Tracker
on:
  pull_request:
  push:
    branches: [feature/series-tracking-v2]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: python -m unittest discover -s scripts/tests
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tome_test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          RESEND_API_KEY: re_ci_placeholder_not_a_secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tome_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/tome_test
      RUN_DATABASE_TESTS: 'true'
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      RESEND_API_KEY: re_ci_placeholder_not_a_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      COLLECTION_IMPORT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npx vitest run __tests__/database
      - name: Start disposable test application
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/tome-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tome-dev.log
          exit 1
      - name: Verify HTTP flows and existing library features
        run: npx vitest run __tests__/http __tests__/api/account.test.ts __tests__/api/import.test.ts __tests__/api/auth/login.test.ts __tests__/api/auth/register.test.ts --no-file-parallelism --hookTimeout 30000 --testTimeout 30000
      - name: Test application diagnostics
        if: failure()
        run: tail -n 150 /tmp/tome-dev.log || true
